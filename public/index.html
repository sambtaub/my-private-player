<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .controls { margin-bottom: 20px; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; }
    button { padding: 12px 20px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 5px; }
    #player-container { width: 90%; max-width: 850px; margin: 20px auto; }
    video { width: 100%; height: auto; border-radius: 8px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    #status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Player</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link...">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status"></div>

  <div id="player-container">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    function playVideo() {
      const url = document.getElementById('url').value;
      const status = document.getElementById('status');
      const player = document.getElementById('player');

      if (!url) return;

      status.innerText = 'Connecting to private proxy stream...';
      
      // Feed the local Railway endpoint directly as the video source
      const proxyUrl = `/proxy-video?url=${encodeURIComponent(url)}`;
      player.src = proxyUrl;
      player.load();
      
      player.onloadeddata = () => {
        status.innerText = 'Playing stream from local host...';
      };

      player.onerror = () => {
        status.innerText = 'Failed to load video stream. Try another link.';
      };
    }
  </script>

</body>
</html>
