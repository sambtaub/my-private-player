<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f0f0f; 
      color: #fff; 
      text-align: center; 
      margin: 0; 
      padding: 40px 20px; 
    }
    h2 { margin-bottom: 24px; font-weight: 600; }
    .controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    input { 
      width: 100%; 
      max-width: 500px; 
      padding: 12px 16px; 
      border-radius: 8px; 
      border: 1px solid #333; 
      background: #1a1a1a; 
      color: #fff; 
      font-size: 15px; 
      outline: none; 
    }
    button { 
      padding: 12px 24px; 
      background: #2563eb; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 15px; 
      font-weight: 600; 
    }
    button:hover { background: #1d4ed8; }
    #status { min-height: 24px; margin: 12px 0 20px; color: #a1a1aa; font-size: 14px; }
    #player-wrapper { 
      width: 100%; 
      max-width: 850px; 
      aspect-ratio: 16/9; 
      margin: 0 auto; 
      background: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 12px 40px rgba(0,0,0,0.7); 
    }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <h2>Private Video Streamer</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link..." onkeydown="if(event.key==='Enter') playVideo()">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status">Ready</div>

  <div id="player-wrapper">
    <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>

  <script>
    function extractVideoId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
      return match ? match[1] : null;
    }

    function playVideo() {
      const urlInput = document.getElementById('url');
      const status = document.getElementById('status');
      const player = document.getElementById('player');
      const videoId = extractVideoId(urlInput.value.trim());

      if (!videoId) {
        status.innerText = 'Please enter a valid YouTube link.';
        return;
      }

      status.innerText = 'Loading video...';
      
      // Load video through privacy-enhanced embedded player
      player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0`;
      
      status.innerText = 'Playing stream.';
    }
  </script>

</body>
</html>
