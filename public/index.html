<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .controls { margin-bottom: 20px; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin-left: 5px; }
    #player-wrapper { width: 90%; max-width: 850px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video { width: 100%; height: auto; display: block; background: #000; }
    #status { margin: 12px 0; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Streamer</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link...">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status"></div>

  <div id="player-wrapper">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    let hlsInstance = null;

    async function playVideo() {
      const url = document.getElementById('url').value.trim();
      const status = document.getElementById('status');
      const video = document.getElementById('player');

      if (!url) return;

      status.innerText = 'Extracting media stream...';

      if (hlsInstance) {
        hlsInstance.destroy();
      }

      try {
        const response = await fetch(`/get-hls-manifest?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.status === 'success' && data.url) {
          status.innerText = 'Playing video stream...';
          
          if (data.url.includes('.m3u8') && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(data.url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
              video.play();
            });
          } else {
            video.src = data.url;
            video.play();
          }
        } else {
          status.innerText = 'All API nodes failed. Please try a different video link.';
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Network error fetching stream info.';
      }
    }
  </script>

</body>
</html>
