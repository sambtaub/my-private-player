<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Player</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .input-box { margin-bottom: 15px; }
    input { width: 50%; max-width: 500px; padding: 12px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 12px 18px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px; }
    .sources { margin: 10px 0; display: none; }
    .source-btn { background: #444; padding: 6px 12px; font-size: 12px; margin: 0 4px; border-radius: 3px; }
    #player-container { width: 90%; max-width: 850px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    iframe { width: 100%; height: 100%; border: none; }
    #status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Player</h2>
  <div class="input-box">
    <input type="text" id="url" placeholder="Paste YouTube link here...">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status"></div>

  <div class="sources" id="sources-bar">
    <span>Try another server mirror if blocked: </span>
    <button class="source-btn" onclick="switchSource('nocookie')">Mirror 1 (NoCookie)</button>
    <button class="source-btn" onclick="switchSource('invidious')">Mirror 2 (Yewtu.be)</button>
    <button class="source-btn" onclick="switchSource('piped')">Mirror 3 (Piped)</button>
  </div>

  <div id="player-container">
    <iframe id="embed-player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>

  <script>
    let currentMirrors = {};

    async function playVideo() {
      const url = document.getElementById('url').value;
      const status = document.getElementById('status');
      const sourcesBar = document.getElementById('sources-bar');
      const embedPlayer = document.getElementById('embed-player');
      
      if (!url) return;
      
      status.innerText = 'Loading player...';

      try {
        const response = await fetch(`/get-embed?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.nocookie) {
          currentMirrors = data;
          status.innerText = '';
          sourcesBar.style.display = 'block';
          embedPlayer.src = data.nocookie;
        } else {
          status.innerText = 'Error: ' + (data.error || 'Invalid link.');
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Connection error.';
      }
    }

    function switchSource(type) {
      if (currentMirrors[type]) {
        document.getElementById('embed-player').src = currentMirrors[type];
      }
    }
  </script>

</body>
</html>
