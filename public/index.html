<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .controls { margin-bottom: 20px; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin-left: 5px; }
    button:hover { background: #1d4ed8; }
    #player-wrapper { width: 90%; max-width: 850px; height: 480px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video, iframe { width: 100%; height: 100%; border: none; }
    #status { margin: 12px 0; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Player</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link...">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status"></div>

  <div id="player-wrapper">
    <video id="video-element" controls autoplay style="display: none;"></video>
    <iframe id="iframe-element" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="display: none;"></iframe>
  </div>

  <script>
    async function playVideo() {
      const url = document.getElementById('url').value.trim();
      const status = document.getElementById('status');
      const videoEl = document.getElementById('video-element');
      const iframeEl = document.getElementById('iframe-element');

      if (!url) return;

      status.innerText = 'Resolving media source...';
      
      // Reset player states
      videoEl.style.display = 'none';
      iframeEl.style.display = 'none';
      videoEl.src = '';
      iframeEl.src = '';

      try {
        const response = await fetch(`/proxy-video?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.status === 'direct' && data.streamUrl) {
          status.innerText = 'Playing direct stream...';
          videoEl.style.display = 'block';
          videoEl.src = data.streamUrl;
          videoEl.play();
        } else if (data.status === 'embed' && data.embedUrl) {
          status.innerText = 'Playing via embedded proxy...';
          iframeEl.style.display = 'block';
          iframeEl.src = data.embedUrl;
        } else {
          status.innerText = 'Could not resolve media source.';
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Network error while fetching stream info.';
      }
    }
  </script>

</body>
</html>
