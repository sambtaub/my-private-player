<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .controls { margin-bottom: 20px; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin-left: 5px; }
    #player-wrapper { width: 90%; max-width: 850px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video { width: 100%; height: auto; display: block; background: #000; }
    #status { margin: 12px 0; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Streamer</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link...">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status"></div>

  <div id="player-wrapper">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    function playVideo() {
      const url = document.getElementById('url').value.trim();
      const status = document.getElementById('status');
      const player = document.getElementById('player');

      if (!url) return;

      status.innerText = 'Routing stream through same-origin proxy...';
      
      // Request media binary directly from Railway origin
      const proxyUrl = `/stream-pipe?url=${encodeURIComponent(url)}`;
      player.src = proxyUrl;
      player.load();
      
      player.onloadeddata = () => {
        status.innerText = 'Playing...';
        player.play();
      };

      player.onerror = () => {
        status.innerText = 'Stream connection failed. Try another link.';
      };
    }
  </script>

</body>
</html>
