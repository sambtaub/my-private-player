<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Streamer</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 40px 20px; }
    h2 { margin-bottom: 24px; font-weight: 600; }
    .controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    input { width: 100%; max-width: 500px; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; }
    button { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    #status { min-height: 24px; margin: 12px 0 20px; color: #a1a1aa; font-size: 14px; }
    #player-wrapper { width: 100%; max-width: 850px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
    video { width: 100%; height: auto; display: block; background: #000; }
  </style>
</head>
<body>

  <h2>Private Video Streamer</h2>

  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube link..." onkeydown="if(event.key==='Enter') playVideo()">
    <button onclick="playVideo()">Play</button>
  </div>

  <div id="status">Ready</div>

  <div id="player-wrapper">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    let hlsInstance = null;

    function extractVideoId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
      return match ? match[1] : null;
    }

    async function fetchStream(videoId, clientType, clientConfig) {
      const res = await fetch('/proxy-innertube', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: 'player',
          clientType: clientType,
          body: {
            videoId: videoId,
            context: { client: clientConfig }
          }
        })
      });
      return await res.json();
    }

    async function playVideo() {
      const urlInput = document.getElementById('url');
      const status = document.getElementById('status');
      const video = document.getElementById('player');
      const videoId = extractVideoId(urlInput.value.trim());

      if (!videoId) {
        status.innerText = 'Please enter a valid YouTube link.';
        return;
      }

      status.innerText = 'Extracting stream manifest...';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      try {
        // Attempt 1: TV Client HLS Manifest
        let data = await fetchStream(videoId, 'TV', {
          clientName: 'TVHTML5',
          clientVersion: '7.20260101.00.00'
        });

        let mediaUrl = data?.streamingData?.hlsManifestUrl;

        // Attempt 2: Embedded Client HLS Manifest Fallback
        if (!mediaUrl) {
          status.innerText = 'Retrying via Embedded player node...';
          data = await fetchStream(videoId, 'EMBEDDED', {
            clientName: 'WEB_EMBEDDED_PLAYER',
            clientVersion: '1.20260101.00.00'
          });
          mediaUrl = data?.streamingData?.hlsManifestUrl;
        }

        // Attempt 3: Direct Progressive Stream URL
        if (!mediaUrl && data?.streamingData?.formats?.length > 0) {
          const direct = data.streamingData.formats.find(f => f.url);
          if (direct) mediaUrl = direct.url;
        }

        if (mediaUrl) {
          status.innerText = 'Playing video stream...';
          
          if (mediaUrl.includes('.m3u8') && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(mediaUrl);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
              video.play();
            });
          } else {
            video.src = mediaUrl;
            video.play();
          }
        } else {
          status.innerText = 'This video is age-restricted or disabled for embedded playback.';
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Error resolving video stream.';
      }
    }
  </script>

</body>
</html>
