<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bypass Player</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .controls { margin: 20px 0; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1f1f1f; color: #fff; }
    button { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #player-container { width: 90%; max-width: 800px; margin: 0 auto; }
    video { width: 100%; height: auto; border-radius: 8px; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #status { margin: 10px 0; color: #9ca3af; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Private Video Streamer</h2>
  
  <div class="controls">
    <input type="text" id="url" placeholder="Paste YouTube Link...">
    <button onclick="streamMedia()">Load</button>
  </div>

  <div id="status"></div>

  <div id="player-container">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    let currentBlobUrl = null;

    async function streamMedia() {
      const url = document.getElementById('url').value;
      const status = document.getElementById('status');
      const player = document.getElementById('player');

      if (!url) return;

      // Revoke previous blob memory to prevent leaks
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      status.innerText = 'Creating local stream buffer...';
      player.src = '';

      try {
        const response = await fetch(`/fetch-stream?url=${encodeURIComponent(url)}`);
        
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        // Convert the stream into a local browser Blob URL
        const blob = await response.blob();
        currentBlobUrl = URL.createObjectURL(blob);

        status.innerText = 'Playing...';
        player.src = currentBlobUrl;
        player.play();

      } catch (err) {
        console.error(err);
        status.innerText = 'Network policy blocked connection or stream failed.';
      }
    }
  </script>

</body>
</html>
