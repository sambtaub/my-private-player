<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Stream Player</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    input { width: 60%; max-width: 500px; padding: 12px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 12px 18px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #player-container { width: 90%; max-width: 850px; margin: 20px auto; }
    video { width: 100%; height: auto; border-radius: 8px; background: #000; }
    #status { margin-top: 10px; color: #aaa; }
  </style>
</head>
<body>

  <h2>Private Video Player</h2>
  <input type="text" id="url" placeholder="Paste YouTube link...">
  <button onclick="playVideo()">Play</button>
  
  <div id="status"></div>

  <div id="player-container">
    <video id="player" controls autoplay></video>
  </div>

  <script>
    async function playVideo() {
      const url = document.getElementById('url').value;
      const status = document.getElementById('status');
      const player = document.getElementById('player');

      if (!url) return;

      status.innerText = 'Bypassing firewall restrictions...';
      player.src = '';

      try {
        // Request media directly through your Railway domain
        const response = await fetch(`/proxy-stream?url=${encodeURIComponent(url)}`);
        
        if (!response.ok) {
          throw new Error('Server returned ' + response.status);
        }

        // Convert incoming stream into an in-memory Blob URL
        const blob = await response.blob();
        const localMediaUrl = URL.createObjectURL(blob);

        status.innerText = 'Playing...';
        player.src = localMediaUrl;
        player.play();

      } catch (err) {
        console.error(err);
        status.innerText = 'Failed to load video stream. Network filter blocked request.';
      }
    }
  </script>

</body>
</html>
